[workspace]
exclude = ["web/server"]
resolver = "2"

[package]
name = "horseflight"
version = "0.1.0"
edition = "2021"
# Inferred minimum: const mutable references in the Zobrist table generator.
# Only stable Rust 1.96.0 has been installed/tested; 1.83 is metadata, not a tested claim.
rust-version = "1.83"
description = "Horseflight: original chess foundations (board, legal moves, FEN, hashing, game rules), replaceable evaluation and alpha-beta search with bounded quiescence"
publish = false

[dependencies]

[dev-dependencies]
shakmaty = "0.27"

[[bin]]
name = "perft"
path = "src/bin/perft.rs"

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[[bin]]
name = "uci"
path = "src/bin/uci.rs"
