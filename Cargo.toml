[package]
name = "horseflight"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "UCI chess engine with alpha-beta search and optional NNUE evaluation"
publish = false

[features]
# Inference and search instrumentation; excluded from default builds.
profiling = []

[dependencies]

[dev-dependencies]
shakmaty = "0.27"

[[bin]]
name = "perft"
path = "src/bin/perft.rs"

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[[bin]]
name = "uci"
path = "src/bin/uci.rs"
